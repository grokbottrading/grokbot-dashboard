<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c"><title>WAY · Hyperliquid Live</title>
<style>
:root{--bg:#07080c;--card:#10131b;--line:#1d2230;--txt:#e9ecf3;--mut:#7d869c;--gold:#f5c542;--up:#2fd47e;--dn:#ff5470}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 50% -200px,#1a1630,var(--bg));color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px 110px}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 10px}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.live{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 10px var(--up);animation:pulse 1.6s infinite}
.dot.err{background:var(--dn);box-shadow:0 0 10px var(--dn)}
@keyframes pulse{50%{opacity:.35}}
.card{background:linear-gradient(180deg,#121624,var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.big{font-size:46px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#1a1f2d}
.up{color:var(--up)}.dn{color:var(--dn)}
.bar{position:relative;height:12px;background:#1a1f2d;border-radius:99px;margin:30px 0 30px;overflow:visible}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#b8860b,var(--gold));transition:width .6s}
.tick{position:absolute;top:-6px;width:2px;height:24px;background:#3a4258}
.tick span{position:absolute;top:26px;font-weight:600;letter-spacing:.2px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut);white-space:nowrap}
.accts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acct{background:#0c0f17;border:1px solid var(--line);border-radius:14px;padding:10px}
.acct b{display:block;font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.acct small{color:var(--mut);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500;text-align:right;padding:6px 4px;font-size:11px}
td{text-align:right;padding:8px 4px;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.empty{color:var(--mut);text-align:center;padding:14px;font-size:13px}
.strat{font-size:13px;color:var(--gold);font-weight:700}
.scroll{overflow-x:auto}
/* 50 Cent badge */
#fifty{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:8px;background:#0c0f17e6;border:1px solid #3a2f10;border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 6px 24px #0008;animation:bob 3s ease-in-out infinite;user-select:none;-webkit-tap-highlight-color:transparent}
@keyframes bob{50%{transform:translateY(-4px)}}
.vinyl{width:42px;height:42px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#222 2px 4px);position:relative;display:grid;place-items:center;box-shadow:0 0 0 2px var(--gold)}
.vinyl::after{content:"50";width:18px;height:18px;border-radius:50%;background:var(--gold);color:#000;font:800 9px/18px system-ui;text-align:center}
.playing .vinyl{animation:spin 2.4s linear infinite;box-shadow:0 0 0 2px var(--gold),0 0 18px #f5c54288}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;height:4px;background:var(--gold);border-radius:2px}
.playing .eq i{animation:eq .9s ease-in-out infinite}
.playing .eq i:nth-child(2){animation-delay:.2s}.playing .eq i:nth-child(3){animation-delay:.4s}.playing .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.hint{font-size:11px;color:var(--gold);font-weight:700;line-height:1.1}
.hint small{display:block;color:var(--mut);font-weight:500}
#ytwrap{position:fixed;width:1px;height:1px;left:-10px;bottom:0;opacity:.01;pointer-events:none;overflow:hidden}
#t888 span{top:auto;bottom:26px}#t900 span{color:#ffd24a}
</style></head><body><div class="wrap">
<header><h1>WAY · HL Live</h1><div class="live"><span class="dot" id="dot"></span><span id="upd">connecting…</span></div></header>

<div class="card">
 <div class="row"><span class="lbl">Combined equity</span><span class="strat">15m Climax 7/7</span></div>
 <div class="big" id="eq">—</div>
 <div class="row"><span class="pill" id="pnl">vs $888 inception</span><span class="pill" id="upnl">uPnL —</span></div>
 <div class="bar"><div class="fill" id="fill" style="width:0"></div>
  <div class="tick" id="t888"><span>$888</span></div><div class="tick" id="t900"><span>$900</span></div><div class="tick" style="left:calc(100% - 2px)"><span>$1,000</span></div></div>
 <div class="row lbl"><span id="to900">—</span><span id="to1k">—</span></div>
</div>

<div class="accts" id="accts"></div>

<div class="card"><div class="lbl">Open positions</div><div class="scroll"><table><thead><tr><th>Coin</th><th>Side</th><th>Size</th><th>Entry</th><th>Mark</th><th>uPnL</th><th>Liq</th></tr></thead><tbody id="pos"></tbody></table></div></div>

<div class="card"><div class="lbl">Recent fills</div><div class="scroll"><table><thead><tr><th>Time</th><th>Acct</th><th>Coin</th><th>Side</th><th>Size</th><th>Px</th><th>PnL</th></tr></thead><tbody id="fills"></tbody></table></div></div>
</div>

<div id="fifty" role="button" aria-label="Play or pause Piggy Bank"><div class="vinyl"></div><div class="eq"><i></i><i></i><i></i><i></i></div><div class="hint" id="hint">Tap for sound<small>50 Cent · Piggy Bank</small></div></div>
<div id="ytwrap"><div id="yt"></div></div>

<script id="core">
const API="https://api.hyperliquid.xyz/info", INCEPTION=888, RECLAIM=900, GOAL=1000;
const ACCTS=[["A","0xc9b61583156ec4e17b8eafa5149d00a4d80e247a"],["B","0x4a85325e74a549396badfb6feb0d52f2083e4fda"],["C","0xdd5b234c8ba1512d785a5a1ee2017c6b7911c496"]];
async function post(body,tries=3){for(let i=0;i<tries;i++){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(r.ok)return await r.json();}catch(e){if(i===tries-1)throw e}await new Promise(s=>setTimeout(s,400*(i+1)))}throw new Error("HL API failed")}
async function loadAcct([name,user]){
 const [ch,sp,fills,mids]=await Promise.all([post({type:"clearinghouseState",user}),post({type:"spotClearinghouseState",user}),post({type:"userFills",user}),post({type:"allMids"})]);
 const usdc=(sp.balances||[]).find(b=>b.coin==="USDC"), spot=usdc?+usdc.total:0;
 const perp=+(ch.marginSummary?.accountValue||0);
 const equity=spot>0?spot:perp; // spot already includes margin hold; never add both
 const positions=(ch.assetPositions||[]).map(p=>p.position).filter(p=>+p.szi!==0).map(p=>({acct:name,coin:p.coin,side:+p.szi>0?"LONG":"SHORT",size:Math.abs(+p.szi),entry:+p.entryPx,mark:+(mids[p.coin]||p.entryPx),upnl:+p.unrealizedPnl,liq:p.liquidationPx?+p.liquidationPx:null}));
 return {name,equity,positions,fills:(fills||[]).map(f=>({...f,acct:name}))};
}
async function loadAll(){const a=await Promise.all(ACCTS.map(loadAcct));return{accts:a,combined:a.reduce((s,x)=>s+x.equity,0),positions:a.flatMap(x=>x.positions),fills:a.flatMap(x=>x.fills).sort((x,y)=>y.time-x.time).slice(0,15)}}
if(typeof module!=="undefined")module.exports={loadAll};
</script>
<script>
const $=id=>document.getElementById(id), usd=(n,d=2)=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const cls=n=>n>=0?"up":"dn", px=n=>n==null?"—":(+n).toLocaleString("en-US",{maximumFractionDigits:n<1?6:n<100?4:2});
const MIN=800, pct=v=>Math.max(0,Math.min(100,(v-MIN)/(GOAL-MIN)*100));
$("t888").style.left=pct(888)+"%";$("t900").style.left=pct(900)+"%";
const tz={timeZone:"America/Edmonton"};
function render(d){
 const c=d.combined, diff=c-INCEPTION;
 $("eq").textContent=usd(c);
 $("pnl").innerHTML=`<span class="${cls(diff)}">${diff>=0?"+":""}${usd(diff)} (${(diff/INCEPTION*100).toFixed(2)}%)</span> vs $888`;
 const u=d.positions.reduce((s,p)=>s+p.upnl,0);$("upnl").innerHTML=`uPnL <span class="${cls(u)}">${usd(u)}</span>`;
 $("fill").style.width=pct(c)+"%";
 $("to900").textContent=c>=RECLAIM?"✅ $900 reclaimed":usd(RECLAIM-c)+" to $900";
 $("to1k").textContent=c>=GOAL?"🏆 $1,000 hit":usd(GOAL-c)+" to $1,000";
 $("accts").innerHTML=d.accts.map(a=>`<div class="acct"><small>Acct ${a.name}</small><b>${usd(a.equity)}</b><small>${a.positions.length?a.positions.length+" open":"flat"}</small></div>`).join("");
 $("pos").innerHTML=d.positions.length?d.positions.map(p=>`<tr><td><b>${p.coin}</b> <small>${p.acct}</small></td><td class="${p.side==="LONG"?"up":"dn"}">${p.side}</td><td>${px(p.size)}</td><td>${px(p.entry)}</td><td>${px(p.mark)}</td><td class="${cls(p.upnl)}">${usd(p.upnl)}</td><td>${px(p.liq)}</td></tr>`).join(""):`<tr><td colspan="7" class="empty">All flat — waiting for a 15m climax</td></tr>`;
 $("fills").innerHTML=d.fills.length?d.fills.map(f=>{const pn=+f.closedPnl-(+f.fee||0);return`<tr><td>${new Date(f.time).toLocaleString("en-US",{...tz,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</td><td>${f.acct}</td><td>${f.coin}</td><td class="${f.side==="B"?"up":"dn"}">${f.side==="B"?"BUY":"SELL"}</td><td>${px(+f.sz)}</td><td>${px(+f.px)}</td><td class="${cls(pn)}">${+f.closedPnl?usd(pn):"—"}</td></tr>`}).join(""):`<tr><td colspan="7" class="empty">No fills yet</td></tr>`;
}
let busy=false;
async function tick(){if(busy)return;busy=true;try{render(await loadAll());$("dot").className="dot";$("upd").textContent="Updated "+new Date().toLocaleTimeString("en-US",{...tz,hour:"numeric",minute:"2-digit",second:"2-digit"})+" MST"}catch(e){$("dot").className="dot err";$("upd").textContent="Reconnecting…"}busy=false}
tick();setInterval(tick,2000);

// Music: 50 Cent – Piggy Bank
const VID="3dmtR9ao2r4", START=20;let player,ready=false,unlocked=false;
const badge=$("fifty"),hint=$("hint");
function setUI(){const playing=ready&&player.getPlayerState()===1&&!player.isMuted();badge.classList.toggle("playing",playing);hint.firstChild.textContent=playing?"Now playing":(unlocked?"Paused · tap":"Tap for sound")}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player("yt",{width:200,height:113,videoId:VID,playerVars:{start:START,autoplay:1,mute:1,playsinline:1,controls:0,rel:0,loop:1,playlist:VID},events:{onReady:()=>{ready=true;player.mute();player.playVideo();setUI()},onStateChange:e=>{if(e.data===0){player.seekTo(START,true);player.playVideo()}setUI()}}})};
const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);
function soundOn(){if(!ready)return;unlocked=true;player.unMute();player.setVolume(100);player.playVideo();setTimeout(setUI,300)}
function firstTap(e){if(badge.contains(e.target))return;if(!unlocked&&ready){soundOn();["pointerdown","touchend","click"].forEach(t=>document.removeEventListener(t,firstTap,true))}}
["touchend","click"].forEach(t=>document.addEventListener(t,firstTap,true));
badge.addEventListener("click",e=>{e.stopPropagation();if(!ready)return;const playing=player.getPlayerState()===1&&!player.isMuted();if(playing){player.pauseVideo()}else soundOn();setTimeout(setUI,300)});
setInterval(()=>ready&&setUI(),1500);
</script></body></html>
